{% extends "base.html" %}
{% block title %}{{ title }} — PlayNexus{% endblock %}

{% block content %}
<div class="wrap" style="max-width:640px;padding-top:64px;">
  <p style="color:var(--muted);font-size:13px;letter-spacing:.08em;">ERROR {{ code }}</p>
  <h1 style="margin:8px 0 12px;">{{ title }}</h1>
  <p style="color:var(--text-2);margin-bottom:24px;">{{ message }}</p>
  <a class="btn btn-ghost" href="/">Back to search</a>
</div>
{% endblock %}
