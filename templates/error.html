{% extends "base.html" %}
{% import "macros.html" as ui %}
{% block title %}{{ title }} — PlayNexus{% endblock %}

{% block content %}
<div class="wrap page error-page">
  <p class="error-page__code num">{{ code }}</p>
  <h1>{{ title }}</h1>
  <p class="lede">{{ message }}</p>
  <div class="row row--wrap">
    <a class="btn btn--primary" href="{{ url_for('pages.home') }}">Back to search</a>
    <a class="btn" href="{{ url_for('pages.charts_page') }}">See what's popular</a>
  </div>
</div>
{% endblock %}
